<h1 class="visually-hidden">Blogs — Chandan Kumar</h1>
<section class="card animate-in" appScrollReveal>
  <div class="section-head">
    <p class="eyebrow mono">BLOGS</p>
    <h3>Notes from product building and engineering</h3>
  </div>
  <div class="blog-list" *ngIf="blogs().length; else noBlogs" [@staggerIn]="blogs().length">
    <article class="blog-card" *ngFor="let blog of blogs()">
      <span class="category-tag" *ngIf="blog.category">{{ blog.category }}</span>
      <h4>{{ blog.title }}</h4>
      <p>{{ blog.excerpt }}</p>
      <div class="blog-meta">
        <small><i class="fa-regular fa-calendar"></i> {{ blog.publishedAt }}</small>
        <span class="read-more">Read more <i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </article>
  </div>
  <ng-template #noBlogs>
    <div class="empty-state">
      <i class="fa-regular fa-file-lines"></i>
      <p>No posts yet — check back soon.</p>
    </div>
  </ng-template>
</section>
