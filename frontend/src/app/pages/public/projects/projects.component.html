<h1 class="visually-hidden">Projects — Chandan Kumar</h1>
<section class="card animate-in" appScrollReveal>
  <div class="section-head">
    <p class="eyebrow mono">PROJECTS</p>
    <h3>Selected work across modern product teams</h3>
  </div>
  <div class="project-grid" [@staggerIn]="projects().length">
    <article class="project-card" *ngFor="let project of projects()">
      <div class="project-image">
        <img *ngIf="project.image" [src]="project.image" [alt]="project.title" />
        <div class="project-image-placeholder" *ngIf="!project.image">
          <i class="fa-solid fa-diagram-project"></i>
        </div>
        <span class="status-badge" *ngIf="project.status">{{ project.status }}</span>
      </div>
      <div class="project-content">
        <h4>{{ project.title }}</h4>
        <p>{{ project.description }}</p>
        <div class="chip-row">
          <span class="chip" *ngFor="let stack of project.techStack">{{ stack }}</span>
        </div>
        <div class="project-links" *ngIf="project.github || project.demo">
          <a *ngIf="project.demo" [href]="project.demo" target="_blank" rel="noopener" class="link-btn">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Live Demo
          </a>
          <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener" class="link-btn">
            <i class="fa-brands fa-github"></i> Source
          </a>
        </div>
      </div>
    </article>
  </div>
</section>
