<section class="card" appScrollReveal>
  <div class="section-head">
    <p class="eyebrow mono">EXPERIENCE</p>
    <h3>Career milestones</h3>
  </div>

  <div class="timeline" [@staggerIn]="experience().length">
    <article class="timeline-item" *ngFor="let item of experience()">
      <div class="timeline-marker"></div>
      <div class="timeline-content">
        <div class="timeline-head">
          <h4>{{ item.position }}</h4>
          <span class="duration mono">{{ item.duration }}</span>
        </div>
        <p class="company">{{ item.company }}</p>
        <p class="description">{{ item.description }}</p>
        <div class="chip-row" *ngIf="item.technologies.length">
          <span class="chip" *ngFor="let tech of item.technologies">{{ tech }}</span>
        </div>
      </div>
    </article>
  </div>
</section>
